version: "3.8"

services:
  # 1. Frontend: Chainlit (Python)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app
    command: sh -c "pip install -r requirements.txt && chainlit run app.py --host 0.0.0.0 --port 8000"
    environment:
      - BACKEND_API_URL=http://api:8080
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET:-cambiame_por_un_secreto_largo}
    depends_on:
      api:
        condition: service_healthy

  # 2. Backend: FastAPI (Python) - Recibe archivos y encola tareas rápidas
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - .:/workspace
      - ~/.aws:/root/.aws:ro  # Credenciales locales de AWS Bedrock
      - uploads:/uploads
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8080 --reload"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://postgres:postgres@postgres:5432/dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://vector_db:6333}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - UPLOAD_DIR=/uploads
      - PYTHONPATH=/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vector_db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. El Worker (El "Sidekiq" - Celery): Procesa los PDFs de fondo, llama a Bedrock y alimenta Qdrant
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - ./worker:/app
      - .:/workspace
      - ~/.aws:/root/.aws:ro  # El worker también necesita credenciales para llamar a AWS Bedrock
      - uploads:/uploads
    # Comando para arrancar Celery apuntando a tu archivo de tareas (ej: tasks.py)
    command: sh -c "pip install -r requirements.txt && celery -A tasks.celery_app worker --loglevel=info"
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN:-postgresql+asyncpg://postgres:postgres@postgres:5432/dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://vector_db:6333}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - UPLOAD_DIR=/uploads
      - PYTHONPATH=/workspace
    depends_on:
      redis:
        condition: service_healthy
      vector_db:
        condition: service_healthy

  # 4. Vector DB: Qdrant
  vector_db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; IFS= read -r response <&3; [[ \"$$response\" == *200* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 5. Base de Datos Tradicional: Postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - ./seed/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./seed/seed-development.sql:/docker-entrypoint-initdb.d/seed-development.sql:ro
      - ./seed/seed-production.sql:/docker-entrypoint-initdb.d/seed-production.sql:ro
      - ./seed/seed-staging.sql:/docker-entrypoint-initdb.d/seed-staging.sql:ro
      - ./seed/seed-testing.sql:/docker-entrypoint-initdb.d/seed-testing.sql:ro
      - ./seed/shared-schema-and-quotes.sql:/seed-data/shared-schema-and-quotes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 6. La cola de mensajes: Redis (Donde viajan los tickets del "Sidekiq")
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  uploads:
